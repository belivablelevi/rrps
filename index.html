<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Buzzer</title>
<style>
  :root { --red:#d52b1e; --dark:#0b0b12; --gold:#f5c542; --card:#16161f; --text:#f4f4f8; --muted:#9a9ab0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(213,43,30,.45), transparent 55%),
      radial-gradient(ellipse at 80% 0%, rgba(245,197,66,.25), transparent 50%),
      linear-gradient(#14141f, var(--dark));
    background-attachment: fixed;
    overflow-x: hidden;
  }
  nav { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 14px; z-index: 5; }
  nav button {
    background: rgba(255,255,255,.08); color: var(--text); border: 1px solid rgba(255,255,255,.15);
    padding: 8px 20px; border-radius: 999px; font-size: 15px; cursor: pointer;
  }
  nav button.active { background: var(--red); border-color: var(--red); }
  section { display: none; min-height: 100%; }
  section.active { display: block; }

  /* Buzzer page */
  #buzz { display: none; place-items: center; height: 100%; }
  #buzz.active { display: grid; }
  #buzzer {
    width: min(70vw, 60vh, 420px); aspect-ratio: 1; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff6a5c, var(--red) 45%, #8e130a);
    box-shadow: 0 14px 0 #5c0b05, 0 30px 60px rgba(0,0,0,.6), inset 0 -10px 30px rgba(0,0,0,.3);
    color: #fff; font-size: min(30vw, 22vh, 180px); font-weight: 900; line-height: 1;
    transition: transform .06s, box-shadow .06s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #buzzer:active, #buzzer.down { transform: translateY(12px); box-shadow: 0 2px 0 #5c0b05, 0 12px 30px rgba(0,0,0,.6), inset 0 -10px 30px rgba(0,0,0,.3); }
  #flash { position: fixed; inset: 0; background: var(--red); opacity: 0; pointer-events: none; z-index: 4; }
  #flash.on { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  /* Judging page */
  #judge { padding: 70px 16px 40px; max-width: 1000px; margin: 0 auto; }
  h2 { font-size: 22px; margin: 18px 0 10px; }
  .hint { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .card { background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 18px; }
  .card h3 .n { background: var(--red); border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: 14px; flex: none; }
  input[type=text] {
    background: #0e0e16; color: var(--text); border: 1px solid rgba(255,255,255,.18); border-radius: 8px;
    padding: 8px 10px; font-size: 15px; width: 100%;
  }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
  .names label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  .crit { display: grid; grid-template-columns: 130px 1fr 34px; align-items: center; gap: 10px; padding: 5px 0; font-size: 15px; }
  .crit output { text-align: right; font-weight: 700; color: var(--gold); }
  input[type=range] { width: 100%; accent-color: var(--red); }
  .total { text-align: right; font-size: 18px; margin-top: 8px; }
  .total b { color: var(--gold); font-size: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 15px; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.r { font-weight: 800; color: var(--gold); }
  .reset { margin-top: 10px; background: none; border: 1px solid rgba(255,255,255,.2); color: var(--muted); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  textarea { width: 100%; background: #0e0e16; color: var(--text); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 15px; resize: vertical; margin-top: 6px; }
  @media (max-width: 560px) { .crit { grid-template-columns: 100px 1fr 30px; } .names { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav>
  <button id="tabBuzz" class="active">Buzzer</button>
  <button id="tabJudge">Judging</button>
</nav>

<div id="flash"></div>

<section id="buzz" class="active">
  <button id="buzzer" aria-label="Buzzer">✕</button>
</section>

<section id="judge">
  <h2>Group Scoring</h2>
  <p class="hint">Edit each group's name and prompt, then rate each group from 0 to 10. Scores save automatically on this device.</p>
  <div class="card">
    <h3>📝 Props Box</h3>
    <textarea id="propsNote" rows="3" placeholder="Props available..."></textarea>
  </div>
  <div id="groups"></div>
  <h2>Leaderboard</h2>
  <div class="card"><table id="board"></table></div>
  <button class="reset" id="reset">Reset all scores</button>
</section>

<script>
const CRITERIA = ["Creativity", "Teamwork", "Skill", "Entertainment"];
const PROMPTS = ["Dance", "Comedy", "Magic", "Acting", "Miming"];
const KEY = "talentBuzzerV2";

function fresh() {
  return PROMPTS.map((p, i) => ({ name: "Group " + (i + 1), prompt: p, scores: CRITERIA.map(() => 0) }));
}
let data;
try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!Array.isArray(data) || data.length !== 5) data = fresh();
function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }

/* Tabs */
function show(which) {
  document.getElementById("buzz").classList.toggle("active", which === "buzz");
  document.getElementById("judge").classList.toggle("active", which === "judge");
  document.getElementById("tabBuzz").classList.toggle("active", which === "buzz");
  document.getElementById("tabJudge").classList.toggle("active", which === "judge");
}
document.getElementById("tabBuzz").onclick = () => show("buzz");
document.getElementById("tabJudge").onclick = () => show("judge");

/* Buzzer sound */
let ctx;
function buzz() {
  const flash = document.getElementById("flash");
  flash.classList.remove("on"); void flash.offsetWidth; flash.classList.add("on");
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime, g = ctx.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.setValueAtTime(0.5, t + 0.9);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    g.connect(ctx.destination);
    [110, 116, 220].forEach(f => {
      const o = ctx.createOscillator();
      o.type = "sawtooth"; o.frequency.value = f;
      o.connect(g); o.start(t); o.stop(t + 1.1);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(200);
}
const b = document.getElementById("buzzer");
b.addEventListener("pointerdown", buzz);
document.addEventListener("keydown", e => {
  if (e.code === "Space" && document.getElementById("buzz").classList.contains("active") && !e.repeat) {
    e.preventDefault(); b.classList.add("down"); buzz();
  }
});
document.addEventListener("keyup", e => { if (e.code === "Space") b.classList.remove("down"); });

/* Judging */
const total = g => g.scores.reduce((a, c) => a + c, 0);
const max = CRITERIA.length * 10;

function renderBoard() {
  const rows = data.map((g, i) => ({ g, i })).sort((a, c) => total(c.g) - total(a.g));
  document.getElementById("board").innerHTML =
    "<tr><th>#</th><th>Group</th><th>Prompt</th>" + CRITERIA.map(c => "<th>" + c.split(" ")[0] + "</th>").join("") + "<th>Total</th></tr>" +
    rows.map((r, k) => "<tr><td>" + (k + 1) + "</td><td>" + esc(r.g.name) + "</td><td>" + esc(r.g.prompt) + "</td>" +
      r.g.scores.map(s => "<td>" + s + "</td>").join("") + "<td class='r'>" + total(r.g) + "/" + max + "</td></tr>").join("");
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderGroups() {
  const root = document.getElementById("groups");
  root.innerHTML = "";
  data.forEach((g, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML =
      "<h3><span class='n'>" + (i + 1) + "</span>Group " + (i + 1) + "</h3>" +
      "<div class='names'><div><label>Group name</label><input type='text' data-f='name' value=\"" + esc(g.name) + "\"></div>" +
      "<div><label>Prompt</label><input type='text' data-f='prompt' value=\"" + esc(g.prompt) + "\"></div></div>" +
      CRITERIA.map((c, k) => "<div class='crit'><span>" + c + "</span><input type='range' min='0' max='10' step='1' data-k='" + k + "' value='" + g.scores[k] + "'><output>" + g.scores[k] + "</output></div>").join("") +
      "<div class='total'>Total <b>" + total(g) + "</b> / " + max + "</div>";
    el.querySelectorAll("input[type=text]").forEach(inp => inp.oninput = () => { g[inp.dataset.f] = inp.value; save(); renderBoard(); });
    el.querySelectorAll("input[type=range]").forEach(inp => inp.oninput = () => {
      g.scores[+inp.dataset.k] = +inp.value;
      inp.nextElementSibling.textContent = inp.value;
      el.querySelector(".total b").textContent = total(g);
      save(); renderBoard();
    });
    root.appendChild(el);
  });
}
document.getElementById("reset").onclick = () => {
  if (confirm("Reset all names, prompts and scores?")) { data = fresh(); save(); renderGroups(); renderBoard(); }
};
renderGroups(); renderBoard();

</script>
</body>
</html>
